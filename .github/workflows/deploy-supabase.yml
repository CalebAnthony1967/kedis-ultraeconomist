name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Supabase CLI
        run: npm install -g supabase

      # ============================================================
      # Create the config.toml with valid configuration
      # ============================================================
      - name: Create Supabase config
        run: |
          mkdir -p supabase
          cat > supabase/config.toml << 'EOF'
          project_id = "${{ secrets.SUPABASE_PROJECT_ID }}"
          
          [api]
          enabled = true
          port = 54321
          schemas = ["public", "storage", "graphql_public"]
          extra_search_path = ["public", "storage"]
          max_rows = 1000
          
          [functions]
          enabled = true
          
          [functions.explorer-api]
          enabled = true
          verify_jwt = false
          EOF
          
          # Display the config for debugging
          cat supabase/config.toml

      # ============================================================
      # FIX: Removed -y flag (use default non-interactive mode)
      # ============================================================
      - name: Link Supabase Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Explorer API Function
        run: |
          supabase functions deploy explorer-api --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Deployment
        run: |
          curl -s https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/explorer-api/domains || echo "Function deployed but verification may take a moment"
