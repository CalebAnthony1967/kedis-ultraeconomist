name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Supabase CLI
        run: |
          npm install -g supabase

      # ============================================================
      # FIX: Create the required config.toml file
      # ============================================================
      - name: Create Supabase config
        run: |
          mkdir -p supabase
          cat > supabase/config.toml << 'EOF'
          project_id = "${{ secrets.SUPABASE_PROJECT_ID }}"
          
          [api]
          enabled = true
          port = 54321
          schemas = ["public", "kedis_meta"]
          extra_search_path = ["public", "kedis_meta"]
          max_rows = 1000
          
          [functions]
          enabled = true
          
          [functions.explorer-api]
          enabled = true
          verify_jwt = false
          EOF

      - name: Link Supabase Project
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Explorer API Function
        run: |
          supabase functions deploy explorer-api \
            --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
