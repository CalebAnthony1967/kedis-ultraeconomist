name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Explorer API Function
        run: |
          supabase functions deploy explorer-api --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy AlphaEconomist RAG Function
        run: |
          supabase functions deploy alpha-economist-rag --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_HF_TOKEN: ${{ secrets.VITE_HF_TOKEN }}

      - name: Verify Explorer API
        run: |
          curl -s https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/explorer-api/domains || echo "Explorer API deployed but verification check skipped"

      - name: Verify AlphaEconomist RAG Function
        run: |
          curl -s -X POST https://${{ secrets.SUPABASE_PROJECT_ID }}.supabase.co/functions/v1/alpha-economist-rag \
            -H "Content-Type: application/json" \
            -d '{"query":"test"}' || echo "RAG function deployed but verification check skipped"
